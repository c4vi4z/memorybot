name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: choco install innosetup -y
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: memorybot-${{ matrix.os }}
          path: |
            installer_out/*
            *.dmg
