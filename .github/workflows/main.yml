name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag voor de release, bijvoorbeeld v1.0.1 (leeg = alleen bouwen)"
        required: false
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: choco install innosetup -y
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          if-no-files-found: error
          path: |
            installer_out/*
            *.dmg
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: flatten
        run: |
          find artifacts -mindepth 2 -type f -exec mv {} artifacts/ \;
          ls -la artifacts
      - name: code.zip
        run: |
          VER="${TAG#v}"
          FILEVER="$(grep -oE 'APP_VERSION = "[^"]+"' bot.py | grep -oE '[0-9][0-9.]*')"
          test "$VER" = "$FILEVER" || { echo "tag $VER is niet gelijk aan APP_VERSION $FILEVER in bot.py"; exit 1; }
          INST="$(grep -oE 'INSTALLER_API = [0-9]+' launcher.py | grep -oE '[0-9]+')"
          echo "{\"version\": \"$VER\", \"installer_version\": $INST}" > meta.json
          zip code.zip app.py bot.py updater.py meta.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            code.zip
            artifacts/*
